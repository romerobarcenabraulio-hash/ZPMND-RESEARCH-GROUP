# Isolation is the security boundary (OpenClaw SECURITY.md: plugins are trusted code, node:vm is not a boundary,
# sandbox defaults off). The gateway has no route to the internet except the egress proxy, no docker socket,
# a read-only root, no capabilities, no host folders, and (at pilot time) only an RG-dedicated, spend-capped model key.
name: rg
services:
  egress:
    build: { context: ., dockerfile: Dockerfile.egress }
    networks: [research, outside]
    read_only: true
    tmpfs: [/tmp, /var/run, /var/spool/squid, /var/log/squid]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  gateway:
    build: { context: .., dockerfile: runtime/Dockerfile.gateway }
    depends_on: [egress]
    command: ["gateway", "run"]
    networks: [research]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 4g
    volumes:
      - rg-state:/state
      - rg-workspace:/workspace   # a Docker volume, not a host folder: no path from the container to the host
    environment:
      - OPENCLAW_GATEWAY_TOKEN   # random per run; the model key is added at pilot time (RG-only, spend-capped)
  catalog:
    build: { context: ../.., dockerfile: substrate/runtime/Dockerfile.catalog }
    profiles: [catalog]
    depends_on: [egress]
    networks: [research]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    volumes:
      - ../..:/repo:ro          # code, read-only
      - ../../work:/work        # catalog and raw corpus output (git-ignored)
  probe:
    image: docker.io/curlimages/curl@sha256:a134550be58ab783810e613ae96fd253c38f7bdd16d9bf9be350700c7a29ac06
    profiles: [verify]
    networks: [research]
    read_only: true
    cap_drop: [ALL]
    entrypoint: ["sleep", "infinity"]
networks:
  research: { internal: true }
  outside: {}
volumes:
  rg-state: {}
  rg-workspace: {}
