# Open web for research, never internal destinations. Squid checks the RESOLVED address (dst), so DNS rebinding to a
# private range is refused at connect time. Ranges follow OpenClaw docs/security/network-proxy.md "Recommended blocked destinations".
http_port 3128
acl research_net src 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16
acl blocked_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24
acl blocked_dst dst 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl blocked_dst dst ::/128 ::1/128 64:ff9b::/96 100::/64 2001:db8::/32 2002::/16 fc00::/7 fe80::/10 ff00::/8
# Marketplace and vendor phone-home: RG pins versions and installs nothing at runtime (no ClawHub, no catalog/telemetry).
acl blocked_vendor dstdomain -n .clawhub.ai clawhub.openclaw.ai catalog.openclaw.ai telemetry.openclaw.ai
acl web_ports port 80 443
acl SSL_ports port 443
acl CONNECT method CONNECT
# Vendor names first (-n: no DNS needed), then the resolved-address rule (names like localhost or host.docker.internal resolve into it).
http_access deny blocked_vendor
http_access deny blocked_dst
http_access deny !web_ports
http_access deny CONNECT !SSL_ports
http_access allow research_net
http_access deny all
# No caching, no forwarding headers that reveal the client, logs without bodies or auth headers.
cache deny all
forwarded_for delete
via off
logformat rg %ts.%03tu %>a %rm %ru %>Hs %Ss
access_log stdio:/dev/stdout rg
cache_log stdio:/dev/stderr
pid_filename none
pinger_enable off
coredump_dir /tmp
