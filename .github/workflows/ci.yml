name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'  # weekly: re-check the OpenClaw pin against newly published advisories
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m rg.openclaw_policy substrate/openclaw.json
      - name: OpenClaw advisory gate (live)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: python -m rg.advisories --lock substrate/openclaw.lock.json --fetch
  mutation:
    # Every catalog guard must have a test that fails without it (scripts/mutar.py; REGLAS 16b). Throwaway copies
    # with git init and no remote; the baseline must pass first. Read-only token, nothing is pushed.
    if: github.event_name == 'pull_request'  # each PR already proved its head; repeating it on main only spent minutes
    runs-on: ubuntu-24.04
    timeout-minutes: 90  # private runners have 2 cores: ~55 mutants took over 30 min on one runner (2026-10-21)
    strategy:
      fail-fast: false  # every shard reports all of its mutants
      matrix: { shard: [0, 1, 2, 3, 4, 5, 6, 7] }  # 8 runners in parallel (public repo: standard runners are free)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }  # the base, to see what the PR changed
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - run: git config --global user.email ci@invalid && git config --global user.name ci
      - run: python scripts/mutar.py
        env:  # index/total come from the matrix itself, so no shard can be skipped or run twice
          RG_SHARD: '${{ strategy.job-index }}/${{ strategy.job-total }}'
          RG_BASE: '${{ github.event.pull_request.base.sha }}'  # a PR of data only skips: no code or test changed
