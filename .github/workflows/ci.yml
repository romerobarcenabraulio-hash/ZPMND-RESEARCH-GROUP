name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'  # weekly: re-check the OpenClaw pin against newly published advisories
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    services:  # a throwaway Postgres for the database tests (tests/test_postgres.py); its password is the container's, never a real one
      postgres:
        # alpine: its postgres user is uid 70. Debian's is 999, the uid `useradd --system` gives the extraction user of
        # tests/test_aislamiento.py, whose kill-every-process-of-the-user check then killed this database (2026-10-29)
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RG_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
      RG_REQUIRE_DB_TESTS: '1'  # tests/test_postgres.py fails instead of skipping when the Postgres is missing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m rg.openclaw_policy substrate/openclaw.json
      - name: OpenClaw advisory gate (live)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: python -m rg.advisories --lock substrate/openclaw.lock.json --fetch
  mutation:
    # Every catalog guard must have a test that fails without it (scripts/mutar.py; REGLAS 16b). Throwaway copies
    # with git init and no remote; the baseline must pass first. Read-only token, nothing is pushed.
    if: github.event_name == 'pull_request'  # each PR already proved its head; repeating it on main only spent minutes
    runs-on: ubuntu-24.04
    timeout-minutes: 90  # private runners have 2 cores: ~55 mutants took over 30 min on one runner (2026-10-21)
    strategy:
      fail-fast: false  # every shard reports all of its mutants
      matrix: { shard: [0, 1, 2, 3] }  # 4 runners in parallel
    services:  # a throwaway Postgres for the database tests (tests/test_postgres.py); its password is the container's, never a real one
      postgres:
        # alpine: its postgres user is uid 70. Debian's is 999, the uid `useradd --system` gives the extraction user of
        # tests/test_aislamiento.py, whose kill-every-process-of-the-user check then killed this database (2026-10-29)
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RG_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
      RG_REQUIRE_DB_TESTS: '1'  # tests/test_postgres.py fails instead of skipping when the Postgres is missing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - run: git config --global user.email ci@invalid && git config --global user.name ci
      - run: python scripts/mutar.py
        env:  # index/total come from the matrix itself, so no shard can be skipped or run twice
          RG_SHARD: '${{ strategy.job-index }}/${{ strategy.job-total }}'
