name: texto-mx
# On demand: plain text of every raw file in the release raw-mx, so ChangeEvent and relation quotes can be checked
# against the text of a pinned extractor (docs/TEXTO.md). The manifest goes to the data branch `catalog` under
# mx/texto/; the texts go to the release text-mx as content-addressed tar parts, uploaded before the commit. The bot
# never writes code. Deterministic: no model, no network beyond GitHub, no credential beyond GITHUB_TOKEN.
on:
  workflow_dispatch:
    inputs:
      bundles:
        description: 'nuevos = only the raw-mx bundles not done yet (mx/texto/bundles.json); todos = every bundle again (after an extractor version change, or to retry fallo)'
        default: 'nuevos'
permissions:
  contents: read
concurrency:
  group: texto-mx
  cancel-in-progress: false
jobs:
  run:
    # Same runner switch as the catalog (CATALOG_RUNS_ON, a JSON label or label list); unset, GitHub's runner.
    runs-on: ${{ fromJSON(vars.CATALOG_RUNS_ON || '"ubuntu-24.04"') }}
    # 23 hours on our own runner (scripts/runner_controller.sh caps its unit at 24), GitHub's 300 minutes elsewhere; the
    # run's own deadline below follows the same switch, so it ends and publishes before either cap (GPT on fa742b6)
    timeout-minutes: ${{ contains(vars.CATALOG_RUNS_ON || '', 'self-hosted') && 1380 || 300 }}
    permissions:
      contents: write   # read raw-mx, upload to text-mx, push the data branch; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { ref: catalog, path: data, persist-credentials: false }  # no write token on disk while raw files are parsed
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: runner.environment == 'github-hosted'
        with: { python-version: '3.12' }
      - name: Python on our own runner (the system's python3, 3.12 or later, in a venv the job creates)
        if: runner.environment != 'github-hosted'
        run: |  # the runner is new for every job (scripts/runner_controller.sh), so a venv already here means it is not
          [ ! -e "$RUNNER_TEMP/venv" ] || { echo "a venv is already here: this runner is not fresh"; exit 1; }
          python3 -m venv "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Free runner disk (raw bundles and their unpacked files need the room)
        if: runner.environment == 'github-hosted'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - run: pip install -r requirements-dev.txt
      - name: Tests before touching any raw file
        run: python -m unittest discover -s tests -t .
      - name: Download the raw bundles still to do
        env:
          GH_TOKEN: '${{ github.token }}'
          GH_REPO: '${{ github.repository }}'
          BUNDLES: '${{ inputs.bundles }}'   # passed as data, never interpolated into the script
        run: |
          set -euo pipefail
          [[ "$BUNDLES" =~ ^(nuevos|todos)$ ]] || { echo "bundles must be nuevos or todos"; exit 2; }
          gh release view raw-mx --json assets > assets.json
          python -m rg.text.bundles plan --assets assets.json --done data/mx/texto/bundles.json --mode "$BUNDLES" > plan.txt
          mkdir -p bundles
          while read -r asset; do
            [ -n "$asset" ] || continue  # an empty pattern would download every asset
            gh release download raw-mx --pattern "$asset" --dir bundles
          done < plan.txt
          wc -l < plan.txt
          df -h / | tail -1
      - name: Verify every bundle against its sha256 and unpack it (no token from here to the upload)
        run: python -m rg.text.bundles unpack --dir bundles --raw raw --record unpacked.json --delete
      - name: Extract text
        id: texto
        env:
          DEADLINE_MINUTES: ${{ contains(vars.CATALOG_RUNS_ON || '', 'self-hosted') && '1300' || '200' }}
        run: |
          set +e
          python -m rg.text.run --catalog data/mx --raw raw --out data/mx/texto --text texto --bundles-done unpacked.json --deadline-minutes "$DEADLINE_MINUTES"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Upload new texts before the commit, so a manifest line never names an unpublished text
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: |
          set -euo pipefail
          [ -d texto ] && [ -n "$(ls -A texto)" ] || { echo "no new texts"; exit 0; }
          name="texto-mx-$(date -u +%F)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar"  # a re-run gets its own asset name
          tar -C texto -cf - . | split -b 1900m -d - "$name.part"
          rm -rf texto
          sha256sum "$name".part* > "$name.sha256"
          gh release view text-mx >/dev/null 2>&1 || gh release create text-mx --target catalog --title "Texto MX" \
            --notes "Plain text of the raw corpus (sha256/<2>/<text sha256>.txt), one tar per run; see catalog/mx/texto."
          gh release upload text-mx "$name".part* "$name.sha256"
      - name: Commit the manifest to the data branch
        env: { RC: '${{ steps.texto.outputs.rc }}', GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          cd data
          git config user.name "rg-catalog-bot"
          git config user.email "rg-catalog-bot@users.noreply.github.com"
          git add -A mx/texto
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -q -m "texto mx: run ${GITHUB_RUN_ID} (exit ${RC})"
          # token only for these commands, through the environment (never on a command line or on disk)
          auth() { GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" git "$@"; }
          # catalog-mx may have pushed meanwhile; it never writes mx/texto, so the rebase cannot conflict
          auth fetch -q origin catalog
          git rebase -q origin/catalog
          auth push -q origin HEAD:catalog
      - name: Fail on coverage problems
        if: steps.texto.outputs.rc != '0'
        env: { RC: '${{ steps.texto.outputs.rc }}' }
        run: |
          echo "texto run exited ${RC} (3 = a raw without its one status or a bundle that failed its check, 1 = crash). See mx/texto/runs on branch catalog."
          exit 1
