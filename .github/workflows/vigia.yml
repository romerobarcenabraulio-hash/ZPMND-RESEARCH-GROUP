name: vigia
# Vigía de producción (SECURITY.md T26): daily, the last runs on main and the state of every production workflow (list
# and caps in scripts/vigia.py); ONE open issue "Vigía de producción" while any is red, has not finished a run within its
# cap or was turned off by GitHub (apagado), closed with a comment when all are ok, running or paused by a person
# (pausado); only fixed names, states, dates and this repo's run numbers and links reach it. The job ends red while
# anything is red, not running or apagado. Main's code, no secret, contents and runs read, issues write; it reads every
# page of open issues before choosing one.
on:
  schedule:
    - cron: '37 23 * * *'  # daily 23:37 UTC, after catalog-mx's usual window
  workflow_dispatch:
permissions: {}
concurrency: { group: vigia, cancel-in-progress: false }  # one run at a time, so never two issues
jobs:
  vigia:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read   # the runs of the watched workflows
      contents: read   # the checkout of main
      issues: write   # the one vigía issue; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { ref: main, persist-credentials: false }
      - name: Read the last runs on main and the state of every watched workflow
        env: { GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}' }
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vigia"; mkdir -p "$d"
          python3 -I scripts/vigia.py lista > "$d/lista"
          while read -r f; do
            gh api "repos/$REPO/actions/workflows/$f/runs?branch=main&per_page=20" > "$d/$f.json"
            gh api "repos/$REPO/actions/workflows/$f" > "$d/$f.estado.json"  # active, disabled_manually, ...
          done < "$d/lista"
      - name: Decide each one's state and write the issue text
        id: decidir
        env: { REPO: '${{ github.repository }}' }
        run: |
          set -euo pipefail
          python3 -I scripts/vigia.py decidir --repo "$REPO" --dir "$RUNNER_TEMP/vigia" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/vigia/vigia.md" >> "$GITHUB_STEP_SUMMARY"
      - name: One open issue while anything is red or not running, closed with a comment when all is well
        env: { GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}', ALERTA: '${{ steps.decidir.outputs.alerta }}' }
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vigia"; p=0; n=mas
          while [ "$n" = mas ]; do  # every page before choosing; gh or vigia.py failing here stops it with nothing written
            p=$((p + 1))
            gh api "repos/$REPO/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100&page=$p" > "$d/issues-$p.json"
            n=$(python3 -I scripts/vigia.py issue --dir "$d" --paginas "$p")
          done
          if [ "$ALERTA" = true ] && [ -n "$n" ]; then
            gh api -X PATCH "repos/$REPO/issues/$n" --input "$d/cuerpo.json" > /dev/null
          elif [ "$ALERTA" = true ]; then
            gh api -X POST "repos/$REPO/issues" --input "$d/nueva.json" > /dev/null
          elif [ "$ALERTA" = false ] && [ -n "$n" ]; then  # closed only on a decision that read every workflow
            gh api -X POST "repos/$REPO/issues/$n/comments" --input "$d/cierre.json" > /dev/null
            gh api -X PATCH "repos/$REPO/issues/$n" -f state=closed -f state_reason=completed > /dev/null
          fi
      - name: Red while anything is red, has not run within its cap or is apagado
        if: steps.decidir.outputs.alerta != 'false'
        run: exit 1
