name: vigia
# Vigía de producción (SECURITY.md T26): daily, the last runs on main of every production workflow (list and caps in
# scripts/vigia.py); ONE open issue "Vigía de producción" while any is red or has not finished a run within its cap,
# closed with a comment when all are ok or running; only fixed names, states, dates and this repo's run numbers and
# links reach it. The job ends red while anything is red or not running. Main's code, no secret, runs read, issues write.
on:
  schedule:
    - cron: '37 23 * * *'  # daily 23:37 UTC, after catalog-mx's usual window
  workflow_dispatch:
permissions: {}
concurrency: { group: vigia, cancel-in-progress: false }  # one run at a time, so never two issues
jobs:
  vigia:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read   # the runs of the watched workflows
      issues: write   # the one vigía issue; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { ref: main, persist-credentials: false }
      - name: Read the last runs on main of every watched workflow
        env: { GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}' }
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vigia"; mkdir -p "$d"
          python3 -I scripts/vigia.py lista > "$d/lista"
          while read -r f; do
            gh api "repos/$REPO/actions/workflows/$f/runs?branch=main&per_page=20" > "$d/$f.json"
          done < "$d/lista"
      - name: Decide each one's state and write the issue text
        id: decidir
        env: { REPO: '${{ github.repository }}' }
        run: |
          set -euo pipefail
          python3 -I scripts/vigia.py decidir --repo "$REPO" --dir "$RUNNER_TEMP/vigia" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/vigia/vigia.md" >> "$GITHUB_STEP_SUMMARY"
      - name: One open issue while anything is red or not running, closed with a comment when all is well
        env: { GH_TOKEN: '${{ github.token }}', REPO: '${{ github.repository }}', ALERTA: '${{ steps.decidir.outputs.alerta }}' }
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/vigia"
          gh api "repos/$REPO/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" > "$d/issues.json"
          n=$(python3 -I scripts/vigia.py issue --issues "$d/issues.json")
          if [ "$ALERTA" = true ] && [ -n "$n" ]; then
            gh api -X PATCH "repos/$REPO/issues/$n" --input "$d/cuerpo.json" > /dev/null
          elif [ "$ALERTA" = true ]; then
            gh api -X POST "repos/$REPO/issues" --input "$d/nueva.json" > /dev/null
          elif [ "$ALERTA" = false ] && [ -n "$n" ]; then  # closed only on a decision that read every workflow
            gh api -X POST "repos/$REPO/issues/$n/comments" --input "$d/cierre.json" > /dev/null
            gh api -X PATCH "repos/$REPO/issues/$n" -f state=closed -f state_reason=completed > /dev/null
          fi
      - name: Red while anything is red or has not run within its cap
        if: steps.decidir.outputs.alerta != 'false'
        run: exit 1
