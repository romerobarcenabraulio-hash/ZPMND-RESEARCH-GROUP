name: catalog-mx
# Every 3 days: index what is new in Mexico's tier-1 sources, fetch raw within budget, reconcile coverage.
# Code comes from the default branch; the catalog lives on the data branch `catalog`; raw bytes go to release `raw-mx`.
# The bot never writes code. Deterministic acquisition only: no model, no agent, no credentials beyond GITHUB_TOKEN and
# the read-only HF_TOKEN of the gated tesis dataset (an env var of the catalog step only).
on:
  schedule:
    - cron: '0 11 */3 * *'   # 05:00 America/Mexico_City on days 1, 4, 7, ... 31 (day 31 -> 1 is one day apart)
  workflow_dispatch:
    inputs:
      budget:
        description: 'catch-up: max HTTP requests PER SOURCE (empty = registry max_requests). ~1 request/s per host; the run stops sending at 270 min and writes what it gathered'
        default: ''
permissions:
  contents: read
concurrency:
  group: catalog-mx
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write   # push to the data branch and upload release assets; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { ref: catalog, path: data, persist-credentials: false }  # no write token on disk while hostile pages are parsed
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: '3.12' }
      - name: Free runner disk (the raw corpus and its parts need the room)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - run: pip install -r requirements-dev.txt
      - name: Tests before touching any source
        run: python -m unittest discover -s tests -t .
      - name: Catalog run (Mexico)
        id: catalog
        env:
          BUDGET: ${{ inputs.budget }}   # passed as data, never interpolated into the script
          HF_TOKEN: ${{ secrets.HF_TOKEN }}   # read-only; the Fetcher sends it only to huggingface.co (mx.hf-tesis-scjn)
        run: |
          [[ "$BUDGET" =~ ^[0-9]*$ ]] || { echo "budget must be a number"; exit 2; }
          set +e
          day=$(date -u +%F)
          python -m rg.catalog.run --country mx --out data --raw raw ${BUDGET:+--budget "$BUDGET"} --deadline-minutes 240
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - name: Upload raw bundle before the commit, so an entry marked stored always has its bytes published
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          [ -d raw ] && [ -n "$(ls -A raw)" ] || { echo "no new raw files"; exit 0; }
          # One copy only: stream the tar straight into <=1.9 GB parts, then drop the originals (2026-10-21: the run
          # that kept raw files, a tar and its parts at once died while packing, with no log).
          name="raw-mx-$(date -u +%F)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar"  # a re-run gets its own asset name
          tar -C raw -cf - . | split -b 1900m -d - "$name.part"
          rm -rf raw
          sha256sum "$name".part* > "$name.sha256"
          df -h / | tail -1
          gh release view raw-mx >/dev/null 2>&1 || gh release create raw-mx --target catalog --title "Raw corpus MX" \
            --notes "Content-addressed raw files (sha256/<2>/<sha256>.<ext>) from each catalog run; see catalog/mx/runs."
          gh release upload raw-mx "$name".part* "$name.sha256"
      - name: Commit catalog to the data branch
        env: { RC: '${{ steps.catalog.outputs.rc }}', GH_TOKEN: '${{ github.token }}' }
        run: |
          cd data
          git config user.name "rg-catalog-bot"
          git config user.email "rg-catalog-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "catalog mx: run ${GITHUB_RUN_ID} (exit ${RC})"
          # token only for this command, through the environment (never on a command line or on disk)
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            git push -q origin HEAD:catalog
      - name: Fail on coverage or schema problems
        if: steps.catalog.outputs.rc != '0'
        env: { RC: '${{ steps.catalog.outputs.rc }}' }
        run: |
          echo "catalog run exited ${RC} (3 = coverage mismatch, 4 = quarantined entries). See the run manifest on branch catalog."
          exit 1
