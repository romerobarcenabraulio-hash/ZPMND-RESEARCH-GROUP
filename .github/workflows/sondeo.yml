name: sondeo
# Each source of sources/registro/ says how much it holds, in its own words (rg/sondeo.py, docs/SONDEO.md); the result
# goes to branch sondeo as sondeo/<date>.json and sondeo/ultimo.json, and the board's "por medir" is filled from it.
# Code from main only; no secret reaches this workflow; the push token lives only in the step that pushes.
on:
  schedule:
    - cron: '23 7 * * 1'  # Mondays 07:23 UTC
  workflow_dispatch:
permissions: {}
concurrency:
  group: sondeo
  cancel-in-progress: false
jobs:
  sondeo:
    if: github.ref == 'refs/heads/main'  # a dispatch of any other branch never writes the data branch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write  # push branch sondeo; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
      - name: Tests of the sounding before any source is asked
        run: python -m unittest tests.test_sondeo
      - name: Ask every registered source
        timeout-minutes: 45  # the sounding stops itself at 40 (rg/sondeo.py PLAZO) and saves after every source
        run: python -m rg.sondeo --registro sources/registro --out "$RUNNER_TEMP/sondeo.json"
      - name: Commit the result to the data branch
        if: always()  # a run cut short still publishes what it measured (GPT on bff3bed)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          [ -s "$RUNNER_TEMP/sondeo.json" ] || { echo "nothing was measured: nothing to publish"; exit 1; }
          day=$(date -u +%F)
          git init -q datos && cd datos
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin sondeo >/dev/null; then
            git fetch -q --depth 1 origin sondeo && git checkout -q -b sondeo FETCH_HEAD
          else
            git checkout -q --orphan sondeo
          fi
          mkdir -p sondeo
          cp "$RUNNER_TEMP/sondeo.json" "sondeo/${day}.json"
          cp "$RUNNER_TEMP/sondeo.json" sondeo/ultimo.json
          git config user.name "rg-sondeo-bot"
          git config user.email "rg-sondeo-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "sondeo: run ${GITHUB_RUN_ID}"
          # token only for this command, through the environment (never on a command line or on disk)
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            git push -q origin HEAD:sondeo
